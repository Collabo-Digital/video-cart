# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "e4daf36cd7123f3fc98f063cbfcce75b"
name = "Video Cart"
application_url = "https://video-cart.vercel.app/"
embedded = true


[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://video-cart.vercel.app/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "https://video-cart.vercel.app/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_app_proxy,write_products, write_pixels,read_customer_events"

[auth]
redirect_urls = [ "https://video-cart.vercel.app/api/auth" ]

[app_proxy]
url = "https://video-cart.vercel.app/proxy"
subpath = "video-widget"
prefix = "apps"

[build]
automatically_update_urls_on_dev = true