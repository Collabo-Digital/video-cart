# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "e4daf36cd7123f3fc98f063cbfcce75b"
name = "Video Cart"
application_url = "https://video-cart.vercel.app/"
embedded = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/shopify_webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customer_events,write_app_proxy,write_pixels"

[auth]
redirect_urls = [ "https://video-cart.vercel.app/api/auth" ]

[app_proxy]
url = "https://video-cart.vercel.app/proxy"
subpath = "video-widget"
prefix = "apps"
